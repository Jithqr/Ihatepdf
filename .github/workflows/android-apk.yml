name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Android changes (this repo)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Get the original iHatePDF project
        uses: actions/checkout@v4
        with:
          repository: cu-sanjay/iHatePDF
          ref: 29eb82110f22f97e6a22253412c640ee9f1813a5
          path: app

      - name: Apply the Android changes
        run: |
          cp overlay/package.json app/package.json
          cp overlay/capacitor.config.ts app/capacitor.config.ts
          cp overlay/client/src/lib/fileUtils.ts app/client/src/lib/fileUtils.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npx vite build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk iHatePDF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iHatePDF-apk
          path: iHatePDF.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iHatePDF.apk
